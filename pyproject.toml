[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gita-lab"
version = "0.2.0"
description = "Herramientas de procesamiento de señales y aprendizaje automático del GITA Lab (UdeA)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Santiago Alvarez Zuluaga" }]
dependencies = [
    "numpy",
    "scipy>=1.10",  # gita.audio: resample_poly; gita.estadisticas: random_table, odds_ratio
    "soundfile",    # gita.audio: lectura/escritura de archivos de audio
    "pandas",       # gita.audio.disvoice: tablas de características; gita.estadisticas: metadatos
]

[project.optional-dependencies]
graficas = ["matplotlib"]  # gita.estadisticas: diagrama de cajas (boxplot=True)
excel = ["openpyxl"]       # gita.estadisticas: leer metadatos desde .xlsx
dev = ["pytest", "matplotlib", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
