[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gita-lab"
version = "0.2.0"
description = "Herramientas de procesamiento de señales y aprendizaje automático del GITA Lab (UdeA)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Santiago Alvarez Zuluaga" }]
dependencies = [
    "numpy",
    "scipy",      # gita.audio: remuestreo polifásico (resample_poly)
    "soundfile",  # gita.audio: lectura/escritura de archivos de audio
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
